
<nav class="navbar navbar-expand-lg">

  <div class="container-fluid">

    <!-- Logo -->
    <a
      class="navbar-brand"
      routerLink="/myhome"
      (click)="closeMenu()">

      <img
        src="/Barek_logo.png"
        alt="BAREK Logo"
        class="logo">
    </a>


    <!-- Mobile Menu Button -->
    <button
      class="navbar-toggler"
      type="button"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="menuOpen"
      (click)="toggleMenu()">

      <span class="navbar-toggler-icon"></span>

    </button>


    <!-- Navigation -->
    <div
      class="navbar-collapse"
      [class.show]="menuOpen"
      id="navbarNav">

      <ul class="navbar-nav ms-auto">

        <!-- Home -->
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/myhome"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()">

            Home

          </a>
        </li>


        <!-- About -->
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/myabout"
            routerLinkActive="active"
            (click)="closeMenu()">

            About

          </a>
        </li>


        <!-- Education -->
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/myeducation"
            routerLinkActive="active"
            (click)="closeMenu()">

            Education

          </a>
        </li>


        <!-- Experience -->
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/myexperience"
            routerLinkActive="active"
            (click)="closeMenu()">

            Experience

          </a>
        </li>


        <!-- Contact -->
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/mycontact"
            routerLinkActive="active"
            (click)="closeMenu()">

            Contact

          </a>
        </li>

      </ul>

    </div>

  </div>

</nav>


<main class="main-content">

  <router-outlet></router-outlet>

</main>


<app-footer></app-footer>
